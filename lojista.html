<script>
        const SUPABASE_URL = 'https://dxlsknikveslsupngshw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4bHNrbmlrdmVzbHN1cG5nc2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjA5MjAsImV4cCI6MjA4ODYzNjkyMH0.ffcYhfmi_lYNAPCsPqyfUxexmfsxR_HOS36QtKzL3HM';
        
        let supabaseClient;
        const lojistaId = '00000000-0000-0000-0000-000000000001'; 

        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) {
            console.error("Erro ao iniciar Supabase:", e);
        }

        async function carregarPainelLojista() {
            try {
                // 1. Busca dados da Loja
                const { data: loja, error: erroLoja } = await supabaseClient
                    .from('lojistas')
                    .select('*')
                    .eq('id', lojistaId)
                    .single();

                if (erroLoja) throw erroLoja;
                document.getElementById('boas-vindas').innerText = `Olá, ${loja.nome_comercial}! 👋`;

                // 2. Busca os dados de transações do dia para somar os totais
                const hoje = new Date().toISOString().split('T')[0]; // Pega a data de hoje no formato AAAA-MM-DD
                
                const { data: transacoesHoje, error: erroTrans } = await supabaseClient
                    .from('transacoes')
                    .select('valor, tipo')
                    .eq('lojista_id', lojistaId)
                    .gte('data_hora', `${hoje}T00:00:00Z`);

                let totalVendido = 0;
                let totalRecebido = 0;

                if (transacoesHoje) {
                    transacoesHoje.forEach(t => {
                        if (t.tipo === 'venda') totalVendido += parseFloat(t.valor);
                        if (t.tipo === 'pagamento') totalRecebido += parseFloat(t.valor);
                    });
                }

                // Atualiza os valores do resumo na tela
                document.getElementById('vendido-hoje').innerText = `R$ ${totalVendido.toFixed(2).replace('.', ',')}`;
                document.getElementById('recebido-hoje').innerText = `R$ ${totalRecebido.toFixed(2).replace('.', ',')}`;


                // 3. Busca clientes
                const { data: clientes, error: erroClientes } = await supabaseClient
                    .from('clientes')
                    .select('*')
                    .eq('lojista_id', lojistaId);

                if (erroClientes) throw erroClientes;

                renderizarClientes(clientes, loja.nome_comercial, loja.chave_pix);

            } catch (error) {
                console.error("Falha na conexão real. Ativando modo de simulação...", error);
                
                document.getElementById('boas-vindas').innerText = `Olá, Lojista (Modo Simulação)! 👋`;
                document.getElementById('vendido-hoje').innerText = "R$ 45,00";
                document.getElementById('recebido-hoje').innerText = "R$ 0,00";
                
                const clientesFalsos = [
                    {id: '1', nome: 'Cliente Teste 1', telefone: '5511999999999', limite_total: 100},
                    {id: '2', nome: 'Cliente Teste 2', telefone: '5511888888888', limite_total: 200}
                ];
                renderizarClientes(clientesFalsos, "Minha Loja", "pix@loja.com");
            }
        }

        async function renderizarClientes(clientes, nomeLoja, chavePix) {
            const containerClientes = document.getElementById('lista-clientes');
            containerClientes.innerHTML = ''; 

            const selectCliente = document.getElementById('select-cliente');
            selectCliente.innerHTML = '';

            if (!clientes || clientes.length === 0) {
                containerClientes.innerHTML = '<p style="text-align: center; color: #888;">Nenhum cliente cadastrado.</p>';
                return;
            }

            for (const cliente of clientes) {
                const option = document.createElement('option');
                option.value = cliente.id;
                option.innerText = cliente.nome;
                selectCliente.appendChild(option);

                let saldoDevedor = 0; 
                
                try {
                    const { data: transacoesCliente } = await supabaseClient
                        .from('transacoes')
                        .select('valor, tipo')
                        .eq('cliente_id', cliente.id);

                    if (transacoesCliente) {
                        transacoesCliente.forEach(t => {
                            if (t.tipo === 'venda') saldoDevedor += parseFloat(t.valor);
                            if (t.tipo === 'pagamento') saldoDevedor -= parseFloat(t.valor);
                        });
                    }
                } catch(e) { 
                    saldoDevedor = 30.00; // Simulação se falhar
                }

                const limiteDisponivel = parseFloat(cliente.limite_total) - saldoDevedor;
                let statusClasse = 'ok';
                let statusTexto = 'Em dia';
                
                if (saldoDevedor > 0) { statusClasse = 'debt'; statusTexto = 'Devedor'; }
                if (saldoDevedor > (parseFloat(cliente.limite_total) * 0.8)) { statusClasse = 'warning'; statusTexto = 'Próximo ao limite!'; }

                const card = document.createElement('div');
                card.className = 'client-card';
                
                const msgZap = encodeURIComponent(`Olá, ${cliente.nome}! Passando para lembrar que sua conta no ${nomeLoja} está em R$ ${saldoDevedor.toFixed(2).replace('.', ',')}. Segue a chave PIX: ${chavePix}. Obrigado!`);

                card.innerHTML = `
                    <span class="client-name">${cliente.nome}</span>
                    <span class="client-status ${statusClasse}">${statusTexto}</span>
                    <span class="client-details">Deve: R$ ${saldoDevedor.toFixed(2).replace('.', ',')}</span>
                    <span class="client-details">Limite Restante: R$ ${limiteDisponivel.toFixed(2).replace('.', ',')}</span>
                    <div class="client-actions">
                        ${saldoDevedor > 0 ? `<a href="https://wa.me/${cliente.telefone}?text=${msgZap}" target="_blank" class="btn-cobrar">Cobrar no WhatsApp</a>` : ''}
                        <button class="btn-vender" onclick="abrirFormularioVendaRapida('${cliente.id}')">Lançar Venda</button>
                    </div>
                `;
                containerClientes.appendChild(card);
            }
        }

        function abrirFormularioVenda() {
            fecharFormularioCliente(); 
            document.getElementById('form-nova-venda').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function abrirFormularioVendaRapida(clienteId) {
            document.getElementById('select-cliente').value = clienteId;
            abrirFormularioVenda();
        }

        function fecharFormularioVenda() {
            document.getElementById('form-nova-venda').style.display = 'none';
            document.getElementById('valor-venda').value = '';
            document.getElementById('desc-venda').value = '';
        }

        async function salvarVenda() {
            const clienteSelecionado = document.getElementById('select-cliente').value;
            const valor = document.getElementById('valor-venda').value;
            const descricao = document.getElementById('desc-venda').value;

            if (!clienteSelecionado || !valor || valor <= 0) {
                alert('Por favor, selecione um cliente e digite um valor válido.');
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('transacoes')
                    .insert([{
                        cliente_id: clienteSelecionado,
                        lojista_id: lojistaId,
                        tipo: 'venda',
                        valor: parseFloat(valor),
                        descricao: descricao || 'Venda no fiado'
                    }]);

                if (error) throw error;
                
                alert('Venda registrada com sucesso! 🚀');
                fecharFormularioVenda();
                carregarPainelLojista(); 
            } catch(e) {
                alert('Erro ao salvar no banco. Salvando localmente para teste!');
                fecharFormularioVenda();
            }
        }

        function abrirFormularioCliente() {
            fecharFormularioVenda(); 
            document.getElementById('form-novo-cliente').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function fecharFormularioCliente() {
            document.getElementById('form-novo-cliente').style.display = 'none';
            document.getElementById('nome-cliente').value = '';
            document.getElementById('tel-cliente').value = '';
            document.getElementById('limite-cliente').value = '';
        }

        async function salvarCliente() {
            const nome = document.getElementById('nome-cliente').value;
            const telefone = document.getElementById('tel-cliente').value;
            const limite = document.getElementById('limite-cliente').value;

            if (!nome || !telefone || !limite || limite <= 0) {
                alert('Por favor, preencha todos os campos corretamente.');
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('clientes')
                    .insert([{
                        lojista_id: lojistaId,
                        nome: nome,
                        telefone: telefone,
                        limite_total: parseFloat(limite)
                    }]);

                if (error) throw error;

                alert('Cliente cadastrado com sucesso! 🎉');
                fecharFormularioCliente();
                carregarPainelLojista(); 
            } catch(e) {
                alert('Erro ao salvar cliente no banco. Simulação concluída!');
                fecharFormularioCliente();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarPainelLojista();
            
            document.getElementById('acao-nova-venda').onclick = abrirFormularioVenda;
            document.getElementById('btn-cancelar-venda').onclick = fecharFormularioVenda;
            document.getElementById('btn-salvar-venda').onclick = salvarVenda;

            document.getElementById('acao-novo-cliente').onclick = abrirFormularioCliente;
            document.getElementById('btn-cancelar-cliente').onclick = fecharFormularioCliente;
            document.getElementById('btn-salvar-cliente').onclick = salvarCliente;
        });
    </script>
