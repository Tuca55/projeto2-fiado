<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Minha Loja - Projeto Fiado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            color: #333;
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #666;
            text-align: center;
            font-size: 0.95em;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 1em;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background-color: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: 8px;
            word-break: break-all;
        }
        .link-gerado {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #0d47a1;
            text-decoration: none;
        }
        .link-gerado:hover {
            text-decoration: underline;
        }
        
        /* ESTILO PARA O BOTÃO DO WHATSAPP */
        .btn-whatsapp {
            display: block;
            text-align: center;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1em;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .btn-whatsapp:hover {
            background-color: #128c7e;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.js"></script>
</head>
<body>

    <div class="container">
        <h1>Criar Minha Conta</h1>
        <p class="subtitle">Cadastre o seu comércio para começar a controlar os seus fiados.</p>

        <label for="nome-loja">Nome da Loja / Comercial:</label>
        <input type="text" id="nome-loja" placeholder="Ex: Mercadinho do bairro" required>

        <label for="tel-loja">Seu WhatsApp (com DDD):</label>
        <input type="text" id="tel-loja" placeholder="Ex: 5511999999999" required>

        <label for="pix-loja">Chave PIX para Receber:</label>
        <input type="text" id="pix-loja" placeholder="E-mail, CPF, CNPJ ou Celular" required>

        <button id="btn-cadastrar">Cadastrar Minha Loja 🚀</button>

        <div id="resultado">
            <p style="margin-top: 0; color: #155724; font-weight: bold;">🎉 Loja cadastrada com sucesso!</p>
            <p style="font-size: 0.9em; color: #555;">Toque no botão abaixo para salvar o link de acesso direto nas suas conversas do WhatsApp:</p>
            
            <a href="#" id="link-zap" class="btn-whatsapp" target="_blank">📲 Salvar Link no meu WhatsApp</a>

            <p style="font-size: 0.8em; color: #888; margin-top: 15px; text-align: center;">Ou copie o link por aqui se preferir:</p>
            <a href="#" id="link-acesso" class="link-gerado" target="_blank"></a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dxlsknikveslsupngshw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4bHNrbmlrdmVzbHN1cG5nc2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjA5MjAsImV4cCI6MjA4ODYzNjkyMH0.ffcYhfmi_lYNAPCsPqyfUxexmfsxR_HOS36QtKzL3HM';
        
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) {
            console.error("Erro ao iniciar Supabase:", e);
        }

        async function cadastrarLoja() {
            const nome = document.getElementById('nome-loja').value;
            // Remove espaços ou traços que o usuário possa digitar no telefone
            const telefone = document.getElementById('tel-loja').value.replace(/\D/g, '');
            const pix = document.getElementById('pix-loja').value;

            if (!nome || !telefone || !pix) {
                alert('Por favor, preencha todos os campos!');
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('lojistas')
                    .insert([{
                        nome_comercial: nome,
                        telefone: telefone,
                        chave_pix: pix
                    }])
                    .select()
                    .single();

                if (error) throw error;

                // Constrói o link do painel
                const linkFinal = `${window.location.origin}${window.location.pathname.replace('cadastro.html', 'lojista.html')}?id=${data.id}`;

                // Cria a mensagem codificada para o WhatsApp
                const mensagemZap = encodeURIComponent(`Olá! Este é o seu link exclusivo de acesso ao Sistema de Fiado do(a) *${nome}*.\n\nGuarde bem esta mensagem para acessar o painel sempre que precisar:\n\n${linkFinal}`);
                
                // Monta o link da API do WhatsApp direcionado para o número do lojista
                const linkApiWhatsApp = `https://wa.me/${telefone}?text=${mensagemZap}`;

                // Atualiza a interface
                document.getElementById('link-zap').href = linkApiWhatsApp;
                document.getElementById('link-acesso').href = linkFinal;
                document.getElementById('link-acesso').innerText = linkFinal;
                document.getElementById('resultado').style.display = 'block';

                // Limpa os campos
                document.getElementById('nome-loja').value = '';
                document.getElementById('tel-loja').value = '';
                document.getElementById('pix-loja').value = '';

            } catch(e) {
                console.error(e);
                alert('Erro ao cadastrar a loja. Verifique a tabela no banco.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-cadastrar').onclick = cadastrarLoja;
        });
    </script>
</body>
</html>
