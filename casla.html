<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Master em Honra - Micro SaaS</title>
    <style>
        .active-pilar { border-color: #4f46e5; background-color: #f5f3ff; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div class="max-w-md mx-auto p-6 bg-white shadow-xl rounded-2xl mt-10">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-indigo-600">Jornada da Honra</h1>
            <p class="text-sm text-slate-500 italic">"Trate com bondade e respeito" [cite: 3]</p>
        </header>

        <div class="mb-8 p-4 border-l-4 border-amber-400 bg-amber-50 rounded-r-lg">
            <h2 class="font-bold flex items-center">
                <span>👂 Pronto para Ouvir [cite: 9]</span>
            </h2>
            <p class="text-[10px] text-amber-700 mb-3 uppercase font-bold">Tiago 1:19 - Demore para falar</p>
            <div class="flex items-center justify-between">
                <span id="timer" class="text-2xl font-mono font-bold text-amber-700">05:00</span>
                <button id="btnTimer" onclick="startTimer()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-1 rounded-full text-sm transition shadow-sm">Iniciar Foco</button>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="font-bold mb-2 flex items-center">💎 Mural de Admiração [cite: 7]</h2>
            <p class="text-xs text-slate-500 mb-3 italic">"Diga o quanto ela é importante para você"[cite: 12].</p>
            <textarea id="admiraInput" rows="2" class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="O que você admira nela hoje?"></textarea>
            <button onclick="salvarElogio()" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-semibold transition shadow-md">Registrar e Enviar</button>
        </div>

        <div class="grid grid-cols-2 gap-4 text-center">
            <button onclick="togglePilar(this, 'gentileza')" class="p-4 border-2 rounded-xl transition hover:shadow-md bg-white">
                <div class="text-2xl">🙏</div>
                <div class="text-[10px] font-bold uppercase mt-1">Gentileza? [cite: 4, 5]</div>
                <div class="text-[8px] text-slate-400 mt-1">"Por favor e Obrigado"</div>
            </button>
            <button onclick="togglePilar(this, 'brandura')" class="p-4 border-2 rounded-xl transition hover:shadow-md bg-white">
                <div class="text-2xl">🕊️</div>
                <div class="text-[10px] font-bold uppercase mt-1">Tom Brando? [cite: 10]</div>
                <div class="text-[8px] text-slate-400 mt-1">"Mesmo se houver diferença"</div>
            </button>
        </div>
        
        <footer class="mt-8 text-center text-[10px] text-slate-400 border-t pt-4">
            Baseado nos princípios de Colossenses 3:12 e 4:6 [cite: 3, 11]
        </footer>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        const supabase = createClient('https://dxlsknikveslsupngshw.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4bHNrbmlrdmVzbHN1cG5nc2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjA5MjAsImV4cCI6MjA4ODYzNjkyMH0.ffcYhfmi_lYNAPCsPqyfUxexmfsxR_HOS36QtKzL3HM')

        // Estado local para os check-ins
        let stats = { gentileza: false, brandura: false };

        // Função para alternar visual e estado dos pilares
        window.togglePilar = async (el, tipo) => {
            stats[tipo] = !stats[tipo];
            if (stats[tipo]) {
                el.classList.add('active-pilar');
                // Salva o check-in no Supabase
                await supabase.from('registros_honra').insert([{ [`pilar_${tipo}`]: true }]);
            } else {
                el.classList.remove('active-pilar');
            }
        };

        // Função para salvar elogio (Pilar 2)
        window.salvarElogio = async () => {
            const input = document.getElementById('admiraInput');
            const elogio = input.value.trim();
            
            if(!elogio) return alert("Escreva um elogio antes de registrar.");
            
            const { error } = await supabase.from('registros_honra').insert([{ pilar_admiracao: elogio }]);
            
            if(!error) {
                alert("Admiração registrada! Um marido que honra a esposa diz coisas que fazem ela se sentir bem[cite: 13].");
                input.value = '';
            } else {
                console.error(error);
                alert("Erro ao salvar. Verifique sua conexão.");
            }
        }

        // Timer de Escuta Ativa (Pilar 3)
        window.startTimer = () => {
            let seconds = 300;
            const display = document.getElementById('timer');
            const btn = document.getElementById('btnTimer');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            const interval = setInterval(async () => {
                let mins = Math.floor(seconds / 60);
                let secs = seconds % 60;
                display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                if (--seconds < 0) {
                    clearInterval(interval);
                    display.innerText = "05:00";
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    
                    // Registra sucesso na escuta no Supabase
                    await supabase.from('registros_honra').insert([{ pilar_escuta: 5 }]);
                    alert("Excelente! Você foi pronto para ouvir[cite: 9]. Isso faz com que ela se sinta amada[cite: 15].");
                }
            }, 1000);
        }
    </script>
</body>
</html>
