<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Método FAN - Fluxo Automático</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #0f172a;
            --accent: #10b981;
            --text-light: #f8fafc;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f1f5f9; text-align: center; }
        
        header { 
            background: linear-gradient(135deg, var(--secondary) 0%, #1e293b 100%); 
            color: white; 
            padding: 60px 20px 100px; 
        }

        .vsl-wrapper { max-width: 800px; margin: -60px auto 40px; padding: 0 15px; }
        
        .vsl-container { 
            position: relative; padding-bottom: 56.25%; height: 0; 
            background: #000; border-radius: 15px; overflow: hidden; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
        }

        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* ESTILO DO BOTÃO ESCONDIDO */
        #cta-section { 
            display: none; /* Começa escondido */
            margin-top: 40px; 
            padding-bottom: 60px;
            animation: fadeIn 1s ease-in; /* Suaviza a aparição */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cta-button { 
            background: var(--accent); 
            color: white; 
            padding: 22px 45px; 
            font-size: 1.5rem; 
            font-weight: bold; 
            text-decoration: none; 
            border-radius: 50px; 
            display: inline-block;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1 style="max-width:800px; margin: 0 auto;">Assista até o final para liberar sua ferramenta</h1>
    </header>

    <div class="vsl-wrapper">
        <div class="vsl-container">
            <div id="player"></div>
        </div>
    </div>

    <div id="cta-section">
        <a href="https://SEU_LINK_DE_CHECKOUT" class="cta-button">
            QUERO O MÉTODO FAN AGORA
        </a>
        <p style="color: #64748b; margin-top: 15px;">🚀 Acesso imediato aos Scripts e Treinamento</p>
    </div>

    <script>
        // 1. Carrega a API de forma assíncrona
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var ctaApareceu = false;
        
        // CONFIGURAÇÃO: Em quantos segundos o botão deve aparecer?
        // Exemplo: 1 minuto e 30 segundos = 90
        var SEGUNDOS_PARA_APARECER = 90; 

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'BSS_-jMhzxA', // Seu vídeo
                playerVars: {
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // Verifica o tempo a cada 1 segundo enquanto o vídeo toca
            if (event.data == YT.PlayerState.PLAYING) {
                var checkTime = setInterval(function() {
                    var currentTime = player.getCurrentTime();
                    
                    if (currentTime >= SEGUNDOS_PARA_APARECER && !ctaApareceu) {
                        document.getElementById('cta-section').style.display = 'block';
                        ctaApareceu = true;
                        clearInterval(checkTime);
                    }
                    
                    // Se o vídeo pausar ou acabar, para de checar para economizar recursos
                    if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
                        clearInterval(checkTime);
                    }
                }, 1000);
            }
        }
    </script>

</body>
</html>
