<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta Fiado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 25px;
            box-sizing: border-box;
        }

        /* --- BLOCO DE ANÚNCIO OTIMIZADO (GATILHOS) --- */
        .espaco-anuncio {
            background: linear-gradient(135deg, #fff9e6 0%, #fff3cd 100%);
            border: 1px solid #ffeeba;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            display: none; /* Ativado via JS */
            animation: fadeIn 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .badge-gatilho {
            background: #d63384;
            color: white;
            font-size: 0.65em;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: inline-block;
        }

        #anuncio-titulo {
            display: block;
            font-size: 1.1em;
            color: #856404;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        #anuncio-descricao {
            display: block;
            font-size: 0.9em;
            color: #665400;
            margin-bottom: 12px;
            font-style: italic;
        }

        .anuncio-preco-container {
            font-size: 1.3em;
            color: #28a745;
            font-weight: 800;
            margin-bottom: 15px;
            display: block;
        }

        .anuncio-btn {
            background-color: #007bff;
            color: white !important;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9em;
            display: inline-block;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
        .anuncio-btn:hover { transform: scale(1.05); }

        /* --- RESTANTE DO ESTILO (MANTIDO) --- */
        h1 { color: #333; text-align: center; font-size: 1.8em; margin-bottom: 20px; }
        h2 { color: #555; font-size: 1.2em; margin-top: 25px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .greeting { color: #007bff; font-size: 1.1em; font-weight: 600; text-align: center; margin-bottom: 10px; }
        .store-name { color: #666; font-size: 0.95em; text-align: center; margin-bottom: 20px; }
        .summary-block { background-color: #e9f7ee; border-radius: 10px; padding: 18px; margin-bottom: 25px; text-align: center; }
        .summary-block .value { font-size: 2.2em; font-weight: 700; color: #28a745; margin-bottom: 10px; }
        .summary-block .value.debt-value { color: #dc3545; }
        .pay-button { display: block; width: 100%; padding: 15px; margin-top: 20px; border: none; border-radius: 8px; font-size: 1.1em; font-weight: 600; cursor: pointer; background-color: #007bff; color: #fff; text-align: center; text-decoration: none; }
        .history-day { margin-bottom: 20px; border: 1px solid #eee; border-radius: 8px; padding: 15px; background-color: #fefefe; }
        .transaction-item { display: flex; justify-content: space-between; font-size: 0.95em; padding: 5px 0; color: #666; }
        .transaction-item.payment .value { color: #28a745; }
        .footer-link { margin-top: 30px; text-align: center; font-size: 0.9em; }
        .footer-link a { color: #007bff; text-decoration: none; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="espaco-anuncio" id="bloco-anuncio">
            <div class="badge-gatilho" id="anuncio-tag">🔥 tenha o emprego dos sonhos</div>
            <strong id="anuncio-titulo"></strong>
            <span id="anuncio-descricao"></span>
            <div class="anuncio-preco-container">
                <span id="anuncio-preco"></span>
            </div>
            <a href="#" id="anuncio-link" class="anuncio-btn">Quero aproveitar agora!</a>
        </div>

        <h1>MEU FIADO 🛍️</h1>
        <p class="greeting" id="boas-vindas">Carregando...</p>
        <p class="store-name">Esta é a sua conta no: <strong id="nome-loja">...</strong></p>

        <h2>💰 RESUMO DA SUA CONTA</h2>
        <div class="summary-block">
            <div class="label">Você Deve:</div>
            <div class="value debt-value" id="valor-devido">R$ 0,00</div>
            <div class="summary-details" style="display: flex; justify-content: space-around; font-size: 0.85em; color: #555;">
                <div><span style="display:block; font-weight:600">Limite Total:</span> R$ <span id="limite-total">0,00</span></div>
                <div><span style="display:block; font-weight:600">Disponível:</span> R$ <span id="limite-disponivel">0,00</span></div>
            </div>
            <a href="#" class="pay-button" id="btn-pix">💸 Pagar Agora via PIX</a>
        </div>

        <h2>📝 SEU HISTÓRICO</h2>
        <div id="container-historico">
            <p style="text-align: center; color: #888;">Buscando histórico...</p>
        </div>
        
        <div class="footer-link">
            <a href="#" id="link-zap" target="_blank">Dúvidas sobre a conta? Chamar no Zap</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dxlsknikveslsupngshw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4bHNrbmlrdmVzbHN1cG5nc2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjA5MjAsImV4cCI6MjA4ODYzNjkyMH0.ffcYhfmi_lYNAPCsPqyfUxexmfsxR_HOS36QtKzL3HM';
        
        let supabaseClient;
        const urlParams = new URLSearchParams(window.location.search);
        const clienteId = urlParams.get('id'); 

        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) { console.error("Erro Supabase:", e); }

        function formatarMoeda(valor) {
            return parseFloat(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        async function carregarDados() {
            // 1. Carregar anúncio com lógica de Gatilhos
            try {
                const { data: anuncio } = await supabaseClient.from('anuncios').select('*').eq('id', 1).single();
                if (anuncio) {
                    document.getElementById('anuncio-titulo').innerText = anuncio.titulo;
                    document.getElementById('anuncio-descricao').innerText = anuncio.descricao;
                    document.getElementById('anuncio-preco').innerText = anuncio.preco;
                    document.getElementById('anuncio-link').href = anuncio.link || '#';
                    
                    // Lógica extra: Se houver a palavra "unidades" ou "restam", muda a cor da tag para Escassez
                    if(anuncio.descricao.toLowerCase().includes('restam') || anuncio.descricao.toLowerCase().includes('apenas')) {
                        document.getElementById('anuncio-tag').innerText = "⏳ Tempo Limitado";
                        document.getElementById('anuncio-tag').style.background = "#ff4d4d";
                    }

                    document.getElementById('bloco-anuncio').style.display = 'block';
                }
            } catch (err) { console.warn("Anúncio não carregado"); }

            if (!clienteId) {
                document.getElementById('boas-vindas').innerText = "Link inválido! ❌";
                return;
            }

            try {
                const { data: cliente, error: erroCliente } = await supabaseClient
                    .from('clientes')
                    .select('*, lojistas(*)')
                    .eq('id', clienteId)
                    .single();

                const { data: transacoes } = await supabaseClient
                    .from('transacoes')
                    .select('*')
                    .eq('cliente_id', clienteId)
                    .order('data_hora', { ascending: false });

                if (cliente) montarTela(cliente, transacoes || []);
            } catch (error) { console.error(error); }
        }

        function montarTela(cliente, transacoes) {
            let totalDevido = 0;
            transacoes.forEach(t => {
                const val = parseFloat(t.valor);
                t.tipo === 'venda' ? totalDevido += val : totalDevido -= val;
            });

            document.getElementById('boas-vindas').innerText = `Olá, ${cliente.nome}! 👋`;
            document.getElementById('nome-loja').innerText = cliente.lojistas.nome_comercial;
            document.getElementById('valor-devido').innerText = formatarMoeda(totalDevido);
            document.getElementById('limite-total').innerText = parseFloat(cliente.limite_total).toFixed(2).replace('.', ',');
            document.getElementById('limite-disponivel').innerText = (parseFloat(cliente.limite_total) - totalDevido).toFixed(2).replace('.', ',');

            document.getElementById('link-zap').href = `https://wa.me/${cliente.lojistas.telefone.replace(/\D/g, '')}`;
            
            document.getElementById('btn-pix').onclick = async (e) => {
                e.preventDefault();
                await navigator.clipboard.writeText(cliente.lojistas.chave_pix);
                alert("✅ Chave PIX copiada!");
            };

            renderizarHistorico(transacoes);
        }

        function renderizarHistorico(transacoes) {
            const container = document.getElementById('container-historico');
            container.innerHTML = '';
            if (transacoes.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #888;">Nenhuma movimentação.</p>';
                return;
            }
            // ... (resto da lógica de renderização do histórico que você já tinha)
            const dias = {};
            transacoes.forEach(t => {
                const d = new Date(t.data_hora).toLocaleDateString('pt-BR');
                if (!dias[d]) dias[d] = [];
                dias[d].push(t);
            });
            for (const dia in dias) {
                const bloco = document.createElement('div');
                bloco.className = 'history-day';
                bloco.innerHTML = `<h3>📅 ${dia}</h3>`;
                dias[dia].forEach(t => {
                    const pago = t.tipo === 'pagamento';
                    bloco.innerHTML += `<div class="transaction-item ${pago ? 'payment' : ''}">
                        <span>${new Date(t.data_hora).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</span>
                        <span style="flex-grow:1; margin-left:10px">${t.description || (pago ? 'Pagamento' : 'Compra')}</span>
                        <span style="font-weight:700; color:${pago?'#28a745':'#dc3545'}">${pago?'+':'-'} ${formatarMoeda(t.valor)}</span>
                    </div>`;
                });
                container.appendChild(bloco);
            }
        }

        document.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
