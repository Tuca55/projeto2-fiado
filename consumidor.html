<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta Fiado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 25px;
            box-sizing: border-box;
        }
        h1 {
            color: #333;
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 20px;
        }
        h2 {
            color: #555;
            font-size: 1.2em;
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .greeting {
            color: #007bff;
            font-size: 1.1em;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
        }
        .store-name {
            color: #666;
            font-size: 0.95em;
            text-align: center;
            margin-bottom: 20px;
        }

        .summary-block {
            background-color: #e9f7ee; /* Light green for positive feel */
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 25px;
            text-align: center;
        }
        .summary-block .label {
            font-size: 0.9em;
            color: #333;
            margin-bottom: 5px;
        }
        .summary-block .value {
            font-size: 2.2em;
            font-weight: 700;
            color: #28a745; /* Darker green for debt */
            margin-bottom: 10px;
        }
        .summary-block .value.debt-value {
            color: #dc3545; /* Red for actual debt */
        }
        .summary-details {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 0.9em;
            color: #555;
        }
        .summary-details div {
            flex: 1;
            text-align: center;
        }
        .summary-details .detail-label {
            font-weight: 600;
            display: block;
        }

        .pay-button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            background-color: #007bff;
            color: #fff;
            transition: background-color 0.3s ease;
            text-align: center;
            text-decoration: none;
        }
        .pay-button:hover {
            background-color: #0056b3;
        }

        .history-day {
            margin-bottom: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            background-color: #fefefe;
        }
        .history-day h3 {
            font-size: 1em;
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px dashed #eee;
            padding-bottom: 5px;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.95em;
            padding: 5px 0;
            color: #666;
        }
        .transaction-item .time {
            font-weight: 600;
            width: 60px;
            flex-shrink: 0;
        }
        .transaction-item .description {
            flex-grow: 1;
            margin: 0 10px;
        }
        .transaction-item .value {
            font-weight: 700;
            color: #dc3545;
            flex-shrink: 0;
            text-align: right;
        }
        .transaction-item.payment .value {
            color: #28a745;
        }

        .footer-link {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9em;
        }
        .footer-link a {
            color: #007bff;
            text-decoration: none;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>MEU FIADO 🛍️</h1>
        <p class="greeting" id="boas-vindas">Carregando...</p>
        <p class="store-name">Esta é a sua conta no: <strong id="nome-loja">...</strong></p>

        <h2>💰 RESUMO DA SUA CONTA</h2>
        <div class="summary-block">
            <div class="label">Você Deve:</div>
            <div class="value debt-value" id="valor-devido">R$ 0,00</div>
            <div class="summary-details">
                <div><span class="detail-label">Limite Total:</span> R$ <span id="limite-total">0,00</span></div>
                <div><span class="detail-label">Limite Disponível:</span> R$ <span id="limite-disponivel">0,00</span></div>
            </div>
            <a href="#" class="pay-button" id="btn-pix">💸 Pagar Agora via PIX</a>
            <p style="font-size: 0.8em; color: #888; margin-top: 10px;">(Copia a chave PIX do lojista automaticamente)</p>
        </div>

        <h2>📝 SEU HISTÓRICO</h2>
        <div id="container-historico">
            <p style="text-align: center; color: #888;">Buscando histórico...</p>
        </div>
        
        <div class="footer-link">
            <a href="#" id="link-zap">Dúvidas sobre a conta? Chamar no Zap</a>
        </div>
    </div>

    <script>
        // !! SUBSTITUA COM SEUS DADOS !!
        const SUPABASE_URL = 'https://dxlsknikveslsupngshw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4bHNrbmlrdmVzbHN1cG5nc2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjA5MjAsImV4cCI6MjA4ODYzNjkyMH0.ffcYhfmi_lYNAPCsPqyfUxexmfsxR_HOS36QtKzL3HM';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const clienteId = '00000000-0000-0000-0000-000000000002'; // ID fixo que usamos no teste

        async function carregarDados() {
            // 1. Busca dados do Cliente e da Loja ligada a ele
            const { data: cliente, error: erroCliente } = await supabase
                .from('clientes')
                .select('*, lojistas(*)')
                .eq('id', clienteId)
                .single();

            if (erroCliente) {
                console.error('Erro cliente:', erroCliente);
                return;
            }

            // 2. Busca todas as transações do cliente
            const { data: transacoes, error: erroTrans } = await supabase
                .from('transacoes')
                .select('*')
                .eq('cliente_id', clienteId)
                .order('data_hora', { ascending: false });

            if (erroTrans) {
                console.error('Erro transações:', erroTrans);
                return;
            }

            // 3. Cálculos de Saldo
            let totalDevido = 0;
            transacoes.forEach(t => {
                if (t.tipo === 'venda') totalDevido += parseFloat(t.valor);
                if (t.tipo === 'pagamento') totalDevido -= parseFloat(t.valor);
            });
            const limiteDisponivel = parseFloat(cliente.limite_total) - totalDevido;

            // 4. Jogando os dados calculados na tela
            document.getElementById('boas-vindas').innerText = `Olá, ${cliente.nome}! 👋`;
            document.getElementById('nome-loja').innerText = cliente.lojistas.nome_comercial;
            document.getElementById('valor-devido').innerText = `R$ ${totalDevido.toFixed(2).replace('.', ',')}`;
            document.getElementById('limite-total').innerText = parseFloat(cliente.limite_total).toFixed(2).replace('.', ',');
            document.getElementById('limite-disponivel').innerText = limiteDisponivel.toFixed(2).replace('.', ',');

            // Ajusta o link do botão de suporte para o Zap do lojista
            document.getElementById('link-zap').href = `https://wa.me/${cliente.lojistas.telefone}`;
            
            // Simulação simples de cópia do PIX (melhoraremos isso em passos futuros)
            document.getElementById('btn-pix').onclick = () => {
                alert(`Chave PIX copiada: ${cliente.lojistas.chave_pix}`);
            };

            // 5. Construindo o Histórico Dinamicamente
            const historicoDiv = document.getElementById('container-historico');
            historicoDiv.innerHTML = ''; // Limpa o "Buscando histórico..."

            if (transacoes.length === 0) {
                historicoDiv.innerHTML = '<p style="text-align: center; color: #888;">Nenhuma movimentação ainda.</p>';
                return;
            }

            // Agrupa as transações por data simples (AAAA-MM-DD)
            const diasAgrupados = {};
            transacoes.forEach(t => {
                const dataSimples = new Date(t.data_hora).toLocaleDateString('pt-BR');
                if (!diasAgrupados[dataSimples]) diasAgrupados[dataSimples] = [];
                diasAgrupados[dataSimples].push(t);
            });

            // Monta o HTML para cada dia
            for (const dia in diasAgrupados) {
                const diaBloco = document.createElement('div');
                diaBloco.className = 'history-day';
                diaBloco.innerHTML = `<h3>📅 ${dia}</h3>`;

                diasAgrupados[dia].forEach(t => {
                    const hora = new Date(t.data_hora).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    const ehPagamento = t.tipo === 'pagamento';
                    
                    diaBloco.innerHTML += `
                        <div class="transaction-item ${ehPagamento ? 'payment' : ''}">
                            <span class="time">${hora}</span>
                            <span class="description">${t.descricao || (ehPagamento ? 'Pagamento' : 'Compra')}</span>
                            <span class="value">${ehPagamento ? '' : '- '}R$ ${parseFloat(t.valor).toFixed(2).replace('.', ',')}</span>
                        </div>
                    `;
                });

                historicoDiv.appendChild(diaBloco);
            }
        }

        // Executa ao abrir a página
        document.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
