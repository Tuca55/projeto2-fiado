<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Fiado - Menu</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .menu { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 300px; width: 100%; }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 20px; }
        a { display: block; padding: 15px; margin: 10px 0; border-radius: 8px; text-decoration: none; font-weight: bold; color: white; transition: background 0.2s; }
        .btn-lojista { background: #007bff; }
        .btn-lojista:hover { background: #0056b3; }
        .btn-consumidor { background: #28a745; }
        .btn-consumidor:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="menu">
        <h1>MANOEL RAMOS</h1>
        <a href="lojista.html" class="btn-lojista">Acessar como Lojista</a>
        <a href="consumidor.html" class="btn-consumidor">Acessar como Cliente</a>
    </div>
</body>
</html>
